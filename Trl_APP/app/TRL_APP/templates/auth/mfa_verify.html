{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación MFA | TRL UTPL</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <main class="login-wrapper">
    <section class="card login-card">
      <div class="brand">
        <img src="{% static 'img/trl-utpl-logo.png' %}" alt="Logotipo TRL UTPL" class="brand-logo">
        <div><p class="eyebrow">Autenticación</p><h1>Verificación MFA</h1></div>
      </div>
      <p class="text-muted">Ingrese el código temporal de seis dígitos para confirmar su identidad.</p>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group mb-3">{{ form.codigo.label_tag }}{{ form.codigo }}</div>
        <button type="submit" class="btn btn-primary full-width">Verificar identidad <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>
</body>
</html>

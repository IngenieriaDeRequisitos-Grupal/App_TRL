{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma TRL · UTPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- Enlace a tu archivo CSS modular -->
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<div class="web-layout">
  <!-- Sidebar Navigation (Desktop) -->
  <nav class="sidebar" id="sidebar" aria-label="Navegación principal desktop">
    <div class="sidebar-header">
      <a href="#" class="sidebar-brand" aria-label="Ir al inicio" onclick="goHome()">
        <span class="brand-icon" aria-hidden="true">🚀</span>
        <span>TRL UTPL</span>
      </a>
    </div>
    <div class="sidebar-nav" id="sidebarNav">
      <!-- Los enlaces de navegación se inyectarán vía JS según el rol -->
    </div>
  </nav>

  <main class="main-content">
    <header class="tbar" id="tbar">
      <button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Abrir menú de navegación" aria-expanded="false" id="mobileMenuBtn">
        ☰
      </button>
      <button class="bk" id="bkBtn" onclick="goBack()" style="display:none" aria-label="Volver atrás">
        <span aria-hidden="true">←</span>
      </button>
      <div class="ttl-wrap">
        <h1 class="ttl" id="tbarTitle">Plataforma TRL</h1>
        <div class="ttl-sub">Portal institucional de evaluación y trazabilidad</div>
      </div>
      <div class="tbar-actions">
        <button class="icon-btn" onclick="showToast('No hay notificaciones nuevas')" aria-label="Notificaciones">
          <span aria-hidden="true">🔔</span>
          <span class="dot"></span>
        </button>
        <button id="logoutBtn" class="icon-btn" onclick="logout()" title="Cerrar sesión" aria-label="Cerrar sesión" style="display:none;">
          <span aria-hidden="true">🚪</span>
        </button>
      </div>
    </header>
    <div class="scr" id="mainScr" role="main"></div>
  </main>
  
  <!-- Bottom Navigation (Mobile) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal móvil" style="display: none;">
    <!-- Enlaces inyectados por JS -->
  </nav>
</div>

<!-- Contenedor para modales -->
<div id="modalContainer"></div>

<!-- Enlace a tu archivo JS modular -->
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>

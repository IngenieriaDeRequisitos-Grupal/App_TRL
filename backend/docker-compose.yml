services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trl_db
      POSTGRES_USER: trl_owner
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}
    volumes:
      - trl_pgdata:/var/lib/postgresql/data
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trl_owner -d trl_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [trl_internal]

  api:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://trl_app:${POSTGRES_APP_PASSWORD}@postgres:5432/trl_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [trl_internal, trl_edge]

networks:
  trl_internal:
    internal: true
  trl_edge:
    driver: bridge

volumes:
  trl_pgdata:
